// RK45 optimization benchmark config
output_dir = "./benchmark_rk45_output";
sample_size = 200000;
max_trajectories = 200000;
interpolation_points = 100;
capture_mode = false;
maximum_number_of_scatterings = 100000000000000L;
maximum_free_time_steps = 1000000000000L;
max_trajectory_wall_time_sec = 30.0;
initial_radius_rsun = 2.0;
trajectory_write_stride = 100;
txt_precision = 10;
clear_existing_trajectories = true;
output_format = "binary";
binary_buffer_size = 1024;

DM_mass = 0.5;
DM_spin = 0.5;
DM_fraction = 1.0;
DM_light = true;

DM_interaction = "SD";
DM_isospin_conserved = true;
DM_relative_couplings = (1.0, 1.0);
DM_cross_section_nucleon = 1.0e-36;
DM_cross_section_electron = 1.0e-80;
DM_form_factor = "Contact";
DM_mediator_mass = 0.0;

DM_distribution = "SHM";
DM_local_density = 0.4;
SHM_v0 = 220.0;
SHM_vObserver = (11.1, 232.2, 7.3);
SHM_vEscape = 544.0;
