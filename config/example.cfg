//DaMaSCUS-SUN Trajectory TXT - Configuration File
//Standard example: 0.5 GeV DM, 1.0e-36 cm^2 nuclear cross section, initial boundary at 2 solar radii.

//Output directory
	output_dir					= "./output";		// Parent output directory. A parameter-specific subdirectory is created below it, such as results_<log10(mass)>_<log10(sigma)>.
	clear_existing_trajectories	= true;			// Options: true or false. If true, existing trajectory_*.txt files in the parameter-specific output directory are deleted before the run.

//Run size and mode
	sample_size					= 1000;			// Number of captured trajectories requested across all MPI ranks.
	max_trajectories			= 100000;		// Maximum total simulated trajectories across all MPI ranks. Set to 0 for no explicit limit.
	capture_mode					= false;		// Options: true or false. false writes all simulated trajectory categories; true is reserved for capture-focused workflows.

//Solar propagation and integration limits
	initial_radius_rsun			= 2.0;			// Initial and outer boundary radius in units of the solar radius R_sun.
	interpolation_points			= 1000;			// Scattering rates are interpolated on a NxN grid to speed up simulations. Recommended value: 1000.
	maximum_number_of_scatterings	= 100000000000000L;	// Maximum number of scatterings allowed in one trajectory before it is marked aborted.
	maximum_free_time_steps		= 1000000000000L;	// Maximum number of free-propagation RK45 steps allowed in one trajectory before it is marked aborted.
	max_trajectory_wall_time_sec	= 300.0;		// Maximum wall-clock seconds allowed for one trajectory. Set to 0.0 for no wall-time limit.

//Trajectory text output
	trajectory_write_stride		= 1;			// Write one row every N accepted RK45 steps. 1 records every accepted step; larger values reduce output size.
	txt_precision				= 10;			// Decimal precision for trajectory TXT columns. Values below 6 are promoted to 6 by the executable.

//Dark matter particle
	DM_mass						= 0.5;			// in GeV
	DM_spin						= 0.5;			// DM spin in units of hbar.
	DM_fraction				= 1.0;			// Fractional abundance of this DM species. Set to 1.0 for 100%.
	DM_light					= true;			// Options: true or false. Use true for low-mass DM, including this 0.5 GeV example.

//Dark matter interaction
	DM_interaction				= "SD";			// Options: "SI", "SD", "DP", or "Dark photon". This example uses spin-dependent nuclear scattering.
	DM_isospin_conserved		= true;			// Options: true or false. Only relevant for SI and SD interactions.
	DM_relative_couplings		= (1.0, 1.0);	// Relative proton and neutron couplings (f_p, f_n), only used if DM_isospin_conserved is false.
	DM_cross_section_nucleon	= 1.0e-36;		// in cm^2
	DM_cross_section_electron	= 1.0e-80;		// in cm^2. Only relevant for SI and SD; set tiny here to effectively disable electron scattering.
	DM_form_factor				= "Contact";	// Options: "Contact", "Electric-Dipole", "Long-Range", "General". Only relevant for SI and DP.
	DM_mediator_mass			= 0.0;			// in MeV. Only relevant if DM_form_factor is "General".

//Dark matter distribution
	DM_distribution				= "SHM";		// Options: "SHM", "SHM++", or "File".
	DM_local_density			= 0.4;			// in GeV/cm^3

//Options for "SHM"
	SHM_v0						= 220.0;		// in km/sec
	SHM_vObserver				= (11.1, 232.2, 7.3);	// in km/sec
	SHM_vEscape				= 544.0;		// in km/sec